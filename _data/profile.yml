short_bio: >-
  <p>
    Hi, I'm Anouar! I am currently pursuing an M.Sc. in
    Information and Communication Engineering at the
    <strong>University of Electronic Science and Technology
    of China (UESTC)</strong>, supervised by
    <a href="https://www.sice.uestc.edu.cn/info/1451/11763.htm"
    target="_blank">Prof. Qi Jin</a>.
    Prior to that, I earned my B.Sc. in Artificial Intelligence
    at <strong>Nanjing University of Information Science and
    Technology (NUIST)</strong>, under the supervision of
    <a href="https://faculty.nuist.edu.cn/ronghuan/en/index.htm"
    target="_blank">Prof. Huan Rong</a>.
    I continue to work closely with Prof. Rong at
    <strong>AiCial (Intelligent Social Computing Lab)</strong>.
  </p>

  <p>
    My research focuses on <strong>Brain-Inspired AI,
    Social Computing, and Trustworthy Multi-Agent Systems</strong>.
    I draw on computational neuroscience, machine learning,
    and LLM-based agents to investigate how individual
    cognition and social interactions give rise to collective
    behaviour. Through my work with AiCial, I also explore
    <strong>opinion dynamics, social influence, and cognitive
    security</strong> in complex online environments.
    My broader goal is to develop scientifically grounded
    AI systems that help us better understand, simulate,
    and evaluate human-AI collective behaviour.
  </p>

  <p>
    <strong>
      I am always happy to explore potential collaborations.
      Feel free to get in touch via
      <a href="mailto:202524010105@std.uestc.edu.cn">email</a>.
    </strong>
  </p>



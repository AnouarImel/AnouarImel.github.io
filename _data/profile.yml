short_bio: >-
  <p>
    I am a graduate researcher in Artificial Intelligence and an
    M.Sc. student in Information and Communication Engineering at
    the <strong>University of Electronic Science and Technology
    of China (UESTC)</strong>. I previously studied Artificial
    Intelligence at <strong>Nanjing University of Information
    Science and Technology (NUIST)</strong>.
  </p>

  <p>
    My research lies at the intersection of
    <strong>Brain-Inspired Artificial Intelligence, Social
    Computing, Trustworthy AI, and Multi-Agent Systems</strong>.
    I am particularly interested in understanding how
    intelligent agents learn, adapt, communicate, and collectively
    shape behaviour in complex social environments.
  </p>

  <p>
    My ongoing research explores cognitively grounded artificial
    societies, opinion dynamics, social influence, continual
    learning, and the reliability of generative AI-based
    simulations. I am interested in combining computational
    neuroscience, machine learning, dynamical systems, and causal
    inference to build AI systems whose behaviour can be
    understood, evaluated, and trusted.
  </p>

  <p>
    Beyond social simulation, I have contributed to research
    involving graph representation learning, molecular
    property prediction, and brain-inspired safe autonomous
    driving. My broader goal is to develop principled methods
    for understanding and governing increasingly autonomous
    AI systems.
  </p>

  <p>
    I welcome research discussions and collaborations in
    trustworthy AI, agent-based modelling, brain-inspired
    computation, and collective intelligence.
  </p>



{% assign publications = include.publications %}

<section class="publication-section">

  <div class="publication-section-header">
    <h2 class="publication-section-title">
      {% if include.title %}
        {{ include.title }}
      {% else %}
        Selected Publications
      {% endif %}
    </h2>

    <a
      class="publication-section-more"
      href="{{ '/publications' | relative_url }}"
    >
      View all <i class="fas fa-arrow-right"></i>
    </a>
  </div>

  <div class="publication-section-list">
    {% for item in publications limit:include.limit %}
      {% include widgets/publication_item.html item=item %}
    {% endfor %}
  </div>

</section>

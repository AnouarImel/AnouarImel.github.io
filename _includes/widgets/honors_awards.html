
{% if site.data.profile.honors and site.data.profile.honors.size > 0 %}
<section class="publication-section honors-section">

  <div class="publication-section-header">
    <h2 class="publication-section-title">
      Honors &amp; Awards
    </h2>
  </div>

  <div class="honors-content">
    <ul class="honors-list">
      {% for item in site.data.profile.honors %}
      <li>
        {% if item.date %}
        <span class="honors-date">{{ item.date }}</span>
        {% endif %}

        <span class="honors-name">{{ item.title }}</span>

        {% if item.org %}
        <span class="honors-organization">
          · {{ item.org }}
        </span>
        {% endif %}
      </li>
      {% endfor %}
    </ul>
  </div>

</section>
{% endif %}

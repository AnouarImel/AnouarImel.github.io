
{% if site.data.home_news and site.data.home_news.size > 0 %}

<section class="publication-section academic-news">

  <div class="academic-news-heading">
    NEWS
  </div>

  <div class="academic-news-scroll"
       role="region"
       aria-label="Recent news updates"
       tabindex="0">

    {% for item in site.data.home_news %}

    <div class="academic-news-row">

      <span class="academic-news-date">
        {{ item.when | escape }}
      </span>

      <span class="academic-news-text">
        {% if item.url %}
          <a href="{{ item.url }}"
             target="_blank"
             rel="noopener noreferrer">
            {{ item.title | escape }}
          </a>
        {% else %}
          {{ item.title | escape }}
        {% endif %}
      </span>

    </div>

    {% endfor %}

  </div>

</section>

{% endif %}
